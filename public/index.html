<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f4c5c">
  <title>AI Property Assistant — Live Demo</title>
  <meta name="description" content="An AI sales and booking agent for real estate offices in Lebanon.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/chat.css">
</head>
<body>
  <div class="stage" id="stage">
    <aside class="hero" id="hero" aria-label="Demo controls"></aside>
    <main class="phone-wrap">
      <section class="phone" id="phone" aria-label="Chat with the property assistant">
        <header class="chat-head" id="chatHead"></header>
        <div class="msgs" id="msgs" role="log" aria-live="polite" aria-relevant="additions"></div>
        <div class="dock" id="dock">
          <div class="compare-bar hidden" id="compareBar"></div>
          <div class="chips" id="chips" aria-label="Quick replies"></div>
          <form class="composer" id="composer" autocomplete="off">
            <button type="button" class="round ghost" id="micBtn" aria-label="Record a voice message"></button>
            <input id="input" class="input-chat" type="text" enterkeyhint="send" maxlength="1500" aria-label="Type your message" dir="auto">
            <button type="submit" class="round send" id="sendBtn" aria-label="Send"></button>
          </form>
          <div class="rec hidden" id="rec" aria-live="polite"></div>
        </div>
      </section>
    </main>
  </div>
  <div class="sheet-backdrop hidden" id="sheetBackdrop"></div>
  <aside class="sheet hidden" id="sheet" aria-label="Demo controls"></aside>
  <script type="module" src="/js/chat.js"></script>
</body>
</html>
