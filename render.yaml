services:
  - type: web
    name: estate-agent
    runtime: node
    plan: starter            # persistent disks need a paid plan
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/app.db
      - key: DEFAULT_OFFICE
        value: beirut-homes
      - key: DEMO_MODE
        value: "true"          # set to "false" for a real customer
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: DASHBOARD_PIN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
