services:
  - type: web
    name: estate-agent
    runtime: node
    plan: free               # free: sleeps when idle, data resets on restart (demo data is re-seeded). Use starter + disk for production.
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: ./data/app.db
      - key: DEFAULT_OFFICE
        value: beirut-homes
      - key: DEMO_MODE
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: DASHBOARD_PIN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
